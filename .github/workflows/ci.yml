name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node == 20
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Check package size
        run: |
          echo "## Package Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Directory | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| dist/esm | $(du -sh dist/esm | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| dist/cjs | $(du -sh dist/cjs | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| dist/types | $(du -sh dist/types | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | $(du -sh dist | cut -f1) |" >> $GITHUB_STEP_SUMMARY

      - name: Verify exports
        run: |
          node -e "import('@oxog/codeshine').then(m => console.log('ESM OK:', Object.keys(m).slice(0,5)))" || echo "ESM import test skipped"
          node -e "const m = require('./dist/cjs/index.js'); console.log('CJS OK:', Object.keys(m).slice(0,5))"
